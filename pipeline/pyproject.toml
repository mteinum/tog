[project]
name = "togpipe"
version = "0.1.0"
description = "Datapipeline for tog: norske jernbane- og geodata -> spillfliser"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "rasterio>=1.4",
    "pyproj>=3.7",
    "shapely>=2.0",
    "pillow>=11.0",
    "requests>=2.32",
    "geopandas>=1.2.0",
    "pyogrio>=0.13.0",
]

[project.scripts]
togpipe = "togpipe.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/togpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: krever nett"]
